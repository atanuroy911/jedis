name: Modified Documentation Tests
jobs:
  doctests:
    runs-on:
      - self-hosted
      - optcd
    services:
      redis:
        image: redis:latest
        options: --health-cmd "redis-cli ping" --health-interval 10s 
          --health-timeout 5s --health-retries 5
        ports:
          - 6379:6379
    steps:
      - name: Setup Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |-
          python -m pip install --upgrade pip
          pip install inotify
      - name: Run inotifywait
        run: |-
          python3 -c "
          import inotify.adapters
          import inotify.constants
          import os
          from datetime import datetime, timezone
          with open('/home/runner/inotifywait-log-doctests.csv', 'w') as log_file:
            i = inotify.adapters.InotifyTree('/home/runner/work/jedis/jedis', inotify.constants.IN_CREATE | inotify.constants.IN_ACCESS)
            for event in i.event_gen(yield_nones=False):
              (_, type_names, path, filename) = event
              now = datetime.now(timezone.utc).strftime('%Y-%m-%dT%H:%M:%S.%f') + 'Z'
              events = ','.join(type_names)
              log_file.write(f'{now};{path};{filename};{events}\n')
              log_file.flush()
              os.fsync(log_file.fileno())
          " &
      - uses: actions/checkout@v6
      - run: touch optcd-3.txt
      - name: Cache dependencies
        uses: actions/cache@v5
        with:
          path: |-
            ~/.m2/repository
            /var/cache/apt
          key: jedis-${{hashFiles('**/pom.xml')}}
      - run: touch optcd-4.txt
      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          java-version: '11'
          distribution: temurin
      - run: touch optcd-5.txt
      - name: Maven offline
        run: |-
          mvn -q dependency:go-offline
      - run: touch optcd-6.txt
      - name: Run doctests
        run: |-
          mvn -Pdoctests clean compile test
      - run: touch optcd-7.txt
      - name: Collect Redis server logs
        run: "mkdir -p redis-logs\ndocker logs ${{ job.services.redis.id }} > redis-logs/redis-server.log
          2>&1\n -Djacoco.skip=true -Dmaven.compiler.proc=none -Dmaven.compiler.skip=true
          -rf /home/runner/work/jedis/jedis/target/test-classes/redis/clients/jedis/prefix/
          /home/runner/work/jedis/jedis/target/test-classes/redis/clients/jedis/search/aggr/
          /home/runner/work/jedis/jedis/target/test-classes/redis/clients/jedis/tls/
          2>&1rm redis-logsdocker true"
      - run: touch optcd-8.txt
      - name: Upload Redis logs and test reports
        uses: actions/upload-artifact@v5
        with:
          name: doctests-redis-logs-${{ github.run_attempt }}
          path: |-
            redis-logs/
            target/surefire-reports/
          if-no-files-found: warn
          retention-days: 14
      - run: touch optcd-9.txt
      - name: Upload inotifywait logs
        uses: actions/upload-artifact@v4
        with:
          name: inotifywait-doctests
          path: /home/runner/inotifywait-log-doctests.csv
    name: doctests
'on':
  - push
  - workflow_dispatch
